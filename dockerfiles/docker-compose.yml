services:
  ansible:
    build:
      context: .
      dockerfile: ansible.dockerfile
    image: ansible-control
    container_name: ansible-control
    env_file:
      - ../.env
    volumes:
      - ../ansible:/ansible
      - ${SERVER_SSH_KEY_PATH_1:-../ansible/files/artur}:/keys/${SERVER_USER_1:-artur}:ro
    working_dir: /ansible
    command: sleep infinity
    tty: true
