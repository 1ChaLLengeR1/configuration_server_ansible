all:
  hosts:
    server1:
      ansible_host: "{{ lookup('env', 'SERVER_HOST_1') }}"
      ansible_user: "{{ lookup('env', 'SERVER_USER_1') | default('root', true) }}"
      ansible_password: "{{ lookup('env', 'SERVER_PASSWORD_1') }}"
      ansible_connection: ssh
      ansible_python_interpreter: auto_silent
