all:
  hosts:
    server1:
      ansible_host: "{{ lookup('env', 'SERVER_HOST_1') }}"
      # port SSH z zewnątrz (Mikrus po IPv4: 10000 + numer VPS-a, np. srv72.mikr.us:10384); domyślnie 22
      ansible_port: "{{ lookup('env', 'SERVER_PORT_1') | default(lookup('env', 'ANSIBLE_REMOTE_PORT'), true) | default('22', true) }}"
      ansible_user: "{{ lookup('env', 'SERVER_USER_1') }}"
      ansible_ssh_private_key_file: "/keys/{{ lookup('env', 'SERVER_USER_1') }}/id_ed25519"
      ansible_connection: ssh
      ansible_python_interpreter: auto_silent
      ansible_become_password: "{{ lookup('env', 'SERVER_PASSWORD_1') }}"
