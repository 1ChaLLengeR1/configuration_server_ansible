---
# Klucz SSH dla docelowego użytkownika jest generowany ręcznie poza Ansible (patrz
# README/instrukcja) i montowany do kontenera pod ścieżką /keys/<SERVER_USER_1>
# (patrz dockerfiles/docker-compose.yml, zmienne SERVER_USER_1 / SERVER_SSH_KEY_PATH_1 w .env).
- name: Utwórz docelowego użytkownika na serwerze
  hosts: all
  become: true
  vars:
    target_user: "{{ lookup('env', 'SERVER_USER_1') }}"
    target_key_path: "/keys/{{ target_user }}/id_ed25519"
    target_password: "{{ lookup('env', 'SERVER_PASSWORD_1') }}"

  tasks:
    - name: Sprawdź, czy klucz publiczny użytkownika jest dostępny w kontenerze
      ansible.builtin.stat:
        path: "{{ target_key_path }}.pub"
      delegate_to: localhost
      become: false
      run_once: true
      register: target_pub_key_stat

    - name: Przerwij, jeśli brakuje klucza publicznego
      ansible.builtin.fail:
        msg: >
          Brak {{ target_key_path }}.pub w kontenerze — wygeneruj klucz na hoście
          (ścieżka z SERVER_SSH_KEY_PATH_1 w .env, nazwa katalogu = SERVER_USER_1)
          i uruchom `make up` ponownie, żeby zamontować katalog.
      when: not target_pub_key_stat.stat.exists

    - name: Utwórz użytkownika z prawami sudo
      ansible.builtin.user:
        name: "{{ target_user }}"
        password: "{{ target_password | password_hash('sha512') }}"
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true

    - name: Utwórz katalog .ssh dla użytkownika
      ansible.builtin.file:
        path: "/home/{{ target_user }}/.ssh"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0700"

    - name: Wgraj klucz publiczny jako authorized_keys
      ansible.builtin.copy:
        content: "{{ lookup('file', target_key_path + '.pub') }}"
        dest: "/home/{{ target_user }}/.ssh/authorized_keys"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"
