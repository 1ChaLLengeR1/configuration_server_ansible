---
# WireGuard (wg0) - szyfrowany tunel między serwerami. Ruch Docker Swarm (zarządzanie, overlay/VXLAN,
# baza, broker) między węzłami idzie WYŁĄCZNIE przez ten tunel - bez niego VXLAN leci plaintextem po
# internecie. Przy jednym węźle tunel jest "pusty" (bez peerów), ale Swarm już słucha na adresie WG,
# więc dołączenie kolejnego węzła = dopisanie peera, bez resetu Swarma.
#
# Klucz prywatny generowany NA SERWERZE (umask 077) i nigdy go nie opuszcza; publiczny wypisywany na
# końcu - potrzebny drugiej stronie tunelu.
#
# Zmienne z .env:
#   WG_ADDRESS_1   - adres tego węzła w tunelu z maską, domyślnie 10.99.0.1/24
# Peery (kolejne węzły) - zmienna `wg_peers` (lista), np. przez `-e @peers.yml`:
#   wg_peers:
#     - name: gcp
#       public_key: "<klucz publiczny drugiego węzła>"
#       endpoint: "<publiczne IP>:51820"
#       allowed_ips: "10.99.0.2/32"
- name: Skonfiguruj WireGuard (wg0)
  hosts: all
  become: true
  vars:
    wg_address: "{{ lookup('env', 'WG_ADDRESS_1') | default('10.99.0.1/24', true) }}"
    wg_port: 51820
    # niżej niż domyślne 1420 - zapas na sieci chmurowe (GCP VPC ma MTU 1460); sieci overlay Swarma
    # w tunelu dostają 1330 (1380 - 50 narzutu VXLAN)
    wg_mtu: 1380
    wg_peers: []

  tasks:
    - name: Zainstaluj WireGuard (wireguard-tools)
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true

    - name: Katalog /etc/wireguard tylko dla roota
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Wygeneruj parę kluczy (tylko jeśli jeszcze nie istnieje)
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        wg genkey | tee /etc/wireguard/wg0.key | wg pubkey > /etc/wireguard/wg0.pub
      args:
        creates: /etc/wireguard/wg0.key
        executable: /bin/bash

    - name: Odczytaj klucz prywatny (do configu)
      ansible.builtin.slurp:
        src: /etc/wireguard/wg0.key
      register: wg_private_key
      no_log: true

    - name: Odczytaj klucz publiczny
      ansible.builtin.slurp:
        src: /etc/wireguard/wg0.pub
      register: wg_public_key

    - name: Konfiguracja interfejsu wg0
      ansible.builtin.copy:
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          # Zarządzane przez Ansible (configuration_server_ansible, wireguard.yml)
          [Interface]
          Address = {{ wg_address }}
          ListenPort = {{ wg_port }}
          MTU = {{ wg_mtu }}
          PrivateKey = {{ wg_private_key.content | b64decode | trim }}
          {% for peer in wg_peers %}

          # {{ peer.name }}
          [Peer]
          PublicKey = {{ peer.public_key }}
          Endpoint = {{ peer.endpoint }}
          AllowedIPs = {{ peer.allowed_ips }}
          PersistentKeepalive = 25
          {% endfor %}
      no_log: true
      notify: Zrestartuj WireGuard

    - name: Włącz wg0 na starcie i uruchom
      ansible.builtin.service:
        name: wg-quick@wg0
        state: started
        enabled: true

    # Swarm słucha na adresie WG - po restarcie serwera Docker nie może wystartować przed wg0,
    # inaczej nie znajdzie swojego adresu (--advertise-addr/--listen-addr).
    - name: Katalog drop-in dla docker.service
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: "0755"

    - name: Docker startuje po WireGuardzie
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/after-wireguard.conf
        mode: "0644"
        content: |
          # Zarządzane przez Ansible (configuration_server_ansible, wireguard.yml)
          [Unit]
          Wants=wg-quick@wg0.service
          After=wg-quick@wg0.service
      notify: Przeładuj systemd

    - name: Zastosuj zmiany (restart wg0 / reload systemd)
      ansible.builtin.meta: flush_handlers

    - name: Sprawdź adres wg0
      ansible.builtin.command: ip -br addr show wg0
      register: wg_addr
      changed_when: false

    - name: Podsumowanie - adres i klucz publiczny (dla drugiej strony tunelu)
      ansible.builtin.debug:
        msg:
          - "wg0: {{ wg_addr.stdout }}"
          - "Klucz publiczny: {{ wg_public_key.content | b64decode | trim }}"

  handlers:
    - name: Zrestartuj WireGuard
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted

    - name: Przeładuj systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
